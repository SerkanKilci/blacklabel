services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: blacklabel-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Developer"
    volumes:
      - blacklabel-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blacklabel-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Blacklabel;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Secret: "${JWT_SECRET}"
      Auth__Apple__BundleId: "${AUTH_APPLE_BUNDLE_ID}"
      Auth__Google__ClientId: "${AUTH_GOOGLE_CLIENT_ID}"
      RevenueCat__WebhookSecret: "${REVENUECAT_WEBHOOK_SECRET}"
      Review__AccessCode: "${REVIEW_ACCESS_CODE}"
      Usda__ApiKey: "${USDA_API_KEY}"

volumes:
  blacklabel-sqldata:
