<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blacklabel — Legal</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --text-secondary: #6b6b6b;
    --border: #e4e7eb;
    --accent: #2e7d32;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --text: #f2f4f7;
      --text-secondary: #9aa2ad;
      --border: #2b3038;
      --accent: #4caf50;
    }
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 64px 24px;
    text-align: center;
  }
  h1 {
    font-size: 26px;
    margin-bottom: 32px;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 12px;
    font-weight: 600;
  }
  a.card span {
    display: block;
    font-weight: 400;
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Blacklabel</h1>
    <a class="card" href="./privacy.html">Privacy Policy<span>How we handle your data</span></a>
    <a class="card" href="./terms.html">Terms of Use<span>Rules for using the app</span></a>
  </div>
</body>
</html>
